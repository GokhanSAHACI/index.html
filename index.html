<meta name="theme-color" content="#10223A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Han's Cube">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10223A; --ink2:#1D3554; --volt:#17C27B; --volt-d:#0C9A5E; --lime:#D6F26A;
  --bg:#E9EFEC; --card:#FFFFFF; --muted:#5F6E80; --line:#D8E0DC; --red:#E0484D; --amber:#F2A20F; --soft:#F5F8F7;
  --head:'Bricolage Grotesque','Manrope',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background:#0B1626;font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid var(--volt);outline-offset:2px}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 500px at 20% 0%,#16345a 0%,#0B1626 60%)}
.device{position:relative;width:100%;max-width:430px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){.device{height:min(880px,96vh);border-radius:38px;border:9px solid #060d18;box-shadow:0 40px 90px rgba(0,0,0,.55)}}
#view{flex:1;overflow-y:auto;padding:16px 18px 28px;padding-top:calc(16px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
#tabs{display:none;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;color:var(--muted);font-size:11.5px;font-weight:700}
#tabs button.on{color:var(--ink)}
#tabs button.on .ic{background:var(--lime)}
.ic{display:grid;place-items:center;width:44px;height:28px;border-radius:14px;transition:background .2s}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3,.head{font-family:var(--head);letter-spacing:-.02em}
.h2{font-size:24px;font-weight:800;line-height:1.15;margin:6px 0 6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card h3{font-size:17px;font-weight:700;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}
.sp{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:12.5px}
.grow{flex:1;min-width:0}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:16px;background:var(--volt);color:var(--ink);font-weight:800;font-size:15.5px;text-align:center;transition:transform .12s,background .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{background:#C9D3CF;color:#8593A0;cursor:not-allowed}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.sm{padding:10px 14px;font-size:13.5px;border-radius:12px;width:auto}
.btn.red{background:var(--red);color:#fff}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btns{display:flex;gap:10px;margin-top:14px}
.btns .btn:first-child:not(:only-child){width:auto;flex:0 0 auto;padding-left:20px;padding-right:20px}
/* header */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .name{font-family:var(--head);font-weight:800;font-size:20px;letter-spacing:-.02em}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--lime);color:var(--ink)}
.chip.dark{background:var(--ink);color:#fff} .chip.amber{background:#FCE7B4} .chip.red{background:#FAD4D5;color:#8d1f23} .chip.grey{background:#E2E8E5;color:var(--muted)} .chip.blue{background:#D6E6FA;color:#123f75}
.iconbtn{width:40px;height:40px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.iconbtn svg{width:19px;height:19px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* welcome */
.welcome{min-height:100%;display:flex;flex-direction:column;gap:18px;justify-content:center}
.welcome h1{font-size:44px;font-weight:800;line-height:1;margin:14px 0 8px}
.welcome p.lead{color:var(--muted);font-size:16px;max-width:30ch}
.role{display:flex;align-items:center;gap:14px;width:100%;padding:18px;border-radius:24px;background:#fff;border:1.5px solid var(--line);margin-bottom:12px;transition:transform .12s,border-color .2s}
.role:active{transform:scale(.985)}
.role:hover{border-color:var(--volt)}
.role .bx{width:52px;height:52px;border-radius:16px;background:var(--lime);display:grid;place-items:center;flex:none}
.role .bx svg{width:28px;height:28px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.role b{font-family:var(--head);font-size:20px;display:block}
.role small{color:var(--muted);font-size:13.5px}
.role.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.role.dark small{color:#A9BAD0}
.role.dark .bx{background:var(--volt)}
.linkbtn{color:var(--ink);font-weight:800;text-decoration:underline;text-underline-offset:4px;text-align:center;width:100%;padding:6px}
/* hero */
.hero{background:var(--ink);color:#fff;border-radius:26px;padding:20px;position:relative;overflow:hidden;margin-bottom:12px}
.hero h2{font-size:26px;line-height:1.1;font-weight:800;max-width:15ch;margin-bottom:14px;position:relative}
.hero .cubebg{position:absolute;right:-30px;top:-20px;opacity:.9}
.vstrip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.vstrip::-webkit-scrollbar{display:none}
.vmini{flex:none;width:96px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 8px;text-align:center}
.vmini .vic{height:34px}
.vmini b{display:block;font-size:12px;margin-top:2px}
.vmini span{font-size:12px;color:var(--volt-d);font-weight:800}
.vic{display:block;color:var(--ink)} .vic svg{width:100%;height:100%}
/* steps */
.steps{display:flex;gap:6px;margin-bottom:14px}
.st{flex:1;display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
.st i{display:block;height:5px;border-radius:5px;background:#CBD6D1;font-size:0}
.st.done i,.st.on i{background:var(--volt)}
.st.on{color:var(--ink)}
/* forms */
label.lbl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.inp{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:0 12px;min-height:50px}
.inp:focus-within{border-color:var(--volt)}
.inp svg{width:19px;height:19px;fill:none;stroke:var(--muted);stroke-width:1.9;flex:none;stroke-linecap:round;stroke-linejoin:round}
.inp input,.inp select{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:13px 0}
.routebox{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;display:none;align-items:center;justify-content:space-between}
.routebox.on{display:flex}
.routebox small{color:#A9BAD0;font-weight:600}
.toggle{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;background:#fff;border:1.5px solid var(--line);border-radius:14px;width:100%}
.toggle .sw{width:44px;height:26px;border-radius:26px;background:#C9D3CF;position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{border-color:var(--amber)} .toggle.on .sw{background:var(--amber)} .toggle.on .sw::after{transform:translateX(18px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{padding:9px 13px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:13.5px}
.pick.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* camera */
.cambtn{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 16px;border-radius:24px;border:2px dashed var(--volt-d);background:#F1FBF6;margin-bottom:10px;text-align:center}
.cambtn .ci{width:58px;height:58px;border-radius:50%;background:var(--volt);display:grid;place-items:center}
.cambtn .ci svg{width:28px;height:28px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cambtn b{font-family:var(--head);font-size:19px}
.item{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;margin-top:10px}
.item img{width:74px;height:74px;border-radius:12px;object-fit:cover;flex:none;background:#ddd}
.item b{font-size:15px}
.item .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.qty button{width:32px;height:30px;text-align:center;font-weight:800;font-size:17px}
.qty span{min-width:26px;text-align:center;font-weight:800}
.ask{background:#FFF6DF;border:1.5px solid var(--amber);border-radius:18px;padding:14px;margin-top:10px}
.ask b{display:block;margin-bottom:8px}
.tot{display:flex;justify-content:space-between;gap:8px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;margin-top:12px;font-weight:700;font-size:14px}
.tot small{display:block;color:#A9BAD0;font-weight:600;font-size:11.5px}
/* vehicles */
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vcard{position:relative;background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 10px 12px;text-align:center;transition:border-color .15s,transform .12s}
.vcard:active{transform:scale(.98)}
.vcard .vic{height:44px;margin:4px 6px 6px}
.vcard b{display:block;font-size:14px}
.vcard .vp{display:block;font-family:var(--head);font-size:21px;font-weight:800;margin-top:2px}
.vcard small{color:var(--muted);font-size:12px}
.vcard.sel{border-color:var(--volt);background:#F1FBF6}
.vcard.off{opacity:.42;cursor:not-allowed}
.vcard .rec{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--lime);font-style:normal;font-size:11.5px;font-weight:800;padding:2px 10px;border-radius:99px;white-space:nowrap}
.fillrow{display:flex;gap:14px;align-items:center}
.bar{height:9px;border-radius:9px;background:#DCE5E1;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;background:var(--volt);border-radius:9px;transition:width .5s}
.bar i.warn{background:var(--amber)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:800;text-align:right}
.eco{display:flex;gap:12px;align-items:center;background:#F1FBF6;border:1px solid #BFE9D3;border-radius:18px;padding:12px 14px;margin-top:10px}
.eco .big{font-family:var(--head);font-size:26px;font-weight:800;color:var(--volt-d);line-height:1}
/* bookings */
.bk .route{font-weight:800;font-size:15.5px}
.bk .vline{display:flex;align-items:center;gap:10px;margin:10px 0}
.bk .vline .vic{width:64px;height:32px;flex:none}
/* corp */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}
.kpi .v{font-family:var(--head);font-size:26px;font-weight:800;line-height:1.05;margin-top:4px}
.kpi .d{font-size:12.5px;font-weight:700;color:var(--volt-d);margin-top:4px}
.kpi .d.bad{color:var(--red)}
.emerg{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:22px;background:linear-gradient(120deg,#F2A20F,#F0761D);color:#2a1500;margin-bottom:12px}
.emerg .bx{width:48px;height:48px;border-radius:15px;background:rgba(255,255,255,.4);display:grid;place-items:center;flex:none}
.emerg svg{width:26px;height:26px;fill:none;stroke:#2a1500;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.emerg b{font-family:var(--head);font-size:19px;display:block}
.emerg small{font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.days{display:flex;gap:6px}
.days button{flex:1;padding:10px 0;text-align:center;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-weight:800;font-size:13px}
.days button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.trip{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.trip .vic{width:58px;height:30px;flex:none}
.trip .tm{width:46px;font-family:var(--head);font-weight:800;font-size:16px;flex:none}
.dayh{font-family:var(--head);font-weight:800;font-size:15px;margin:16px 2px 8px;color:var(--ink2)}
.suggest{background:var(--ink);color:#fff;border-radius:22px;padding:16px;margin-bottom:12px}
.suggest b{font-family:var(--head);font-size:17px;display:block;margin-bottom:4px}
.suggest p{color:#B9C8DA;font-size:13.5px;margin-bottom:12px}
/* admin */
.notif{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;text-align:left}
.notif .dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none;margin-top:6px}
.notif .iconbtn{pointer-events:none}
.bubble{max-width:82%;padding:9px 13px;border-radius:16px;font-size:13.5px;margin-bottom:8px;width:fit-content}
.bubble.me{background:var(--ink);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.bubble.them{background:#fff;border:1px solid var(--line);margin-right:auto;border-bottom-left-radius:4px}
.bubble .t{display:block;opacity:.6;margin-top:2px;font-size:10.5px}
/* sheet */
.sheetwrap{position:absolute;inset:0;z-index:30;display:none}
.sheetwrap.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(6,13,24,.55);animation:fade .2s}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.panel .grab{width:44px;height:5px;border-radius:5px;background:#BBC7C2;margin:-6px auto 14px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pop{width:84px;height:84px;border-radius:50%;background:var(--volt);display:grid;place-items:center;margin:6px auto 12px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.pop svg{width:44px;height:44px;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
/* scan */
#scan{position:absolute;inset:0;z-index:40;background:rgba(6,13,24,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;color:#fff}
#scan.open{display:flex}
.scanbox{position:relative;width:min(300px,80%);border-radius:20px;overflow:hidden;border:2px solid var(--volt)}
.scanbox img{display:block;width:100%}
.scanbox::after{content:'';position:absolute;left:0;right:0;height:3px;background:var(--volt);box-shadow:0 0 18px 6px rgba(23,194,123,.7);animation:scanmove 1.4s ease-in-out infinite alternate}
@keyframes scanmove{from{top:0}to{top:calc(100% - 3px)}}
.corner{position:absolute;width:26px;height:26px;border:3px solid var(--lime);z-index:2}
.c1{top:8px;left:8px;border-right:0;border-bottom:0}.c2{top:8px;right:8px;border-left:0;border-bottom:0}.c3{bottom:8px;left:8px;border-right:0;border-top:0}.c4{bottom:8px;right:8px;border-left:0;border-top:0}
#scanTxt{font-family:var(--head);font-weight:700;font-size:18px;text-align:center;min-height:26px}
/* toast */
#toast{position:absolute;left:16px;right:16px;bottom:88px;z-index:60;background:var(--ink);color:#fff;padding:13px 16px;border-radius:14px;font-weight:700;font-size:14px;text-align:center;opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s}
#toast.on{opacity:1;transform:none}
/* docs */
#doc{position:absolute;inset:0;z-index:50;background:#CBD5D1;display:none;flex-direction:column}
#doc.open{display:flex}
.dtop{background:var(--ink);color:#fff;padding:14px 16px calc(10px);display:flex;align-items:center;gap:10px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.dtop b{font-family:var(--head);font-size:17px;flex:1}
.dtop button{color:#fff;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.dtop svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.dtabs{display:flex;gap:6px;padding:10px 12px;background:var(--ink2)}
.dtabs button{flex:1;text-align:center;padding:9px 4px;border-radius:11px;font-weight:800;font-size:12.5px;color:#B9C8DA;background:transparent}
.dtabs button.on{background:var(--lime);color:var(--ink)}
.dbody{flex:1;overflow-y:auto;padding:14px}
.paper{background:#fff;border-radius:6px;padding:20px 18px;box-shadow:0 8px 24px rgba(0,0,0,.18);position:relative;overflow:hidden;font-size:13px}
.paper::before{content:'PROTOTİP';position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);font-family:var(--head);font-weight:800;font-size:64px;color:rgba(16,34,58,.045);pointer-events:none}
.paper h3{font-size:22px;font-weight:800}
.paper table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px}
.paper th{text-align:left;font-weight:800;border-bottom:2px solid var(--ink);padding:6px 4px}
.paper td{padding:7px 4px;border-bottom:1px solid #E5EBE8;vertical-align:top}
.paper td.r,.paper th.r{text-align:right}
.paper .tt td{border-bottom:0;font-weight:800;font-size:14px}
.paper .party{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;font-size:12px}
.paper .party b{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.paper .note{font-size:11px;color:var(--muted);margin-top:10px}
.dfoot{padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink2);display:flex;gap:10px}
.gbig{text-align:center;padding:10px 0 4px}
.gbig .n{font-family:var(--head);font-size:52px;font-weight:800;color:var(--volt-d);line-height:1}
.cmp{margin:12px 0}
.cmp .l{display:flex;justify-content:space-between;font-weight:700;font-size:12.5px}
.cmp .bar{height:14px}
.cmp .bar i.ice{background:#8C98A6}
.cert{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--volt-d);border-radius:14px;padding:12px;margin-top:12px}
@media print{
  body *{visibility:hidden}
  .doc-print,.doc-print *{visibility:visible}
  .doc-print{position:absolute;left:0;top:0;width:100%;box-shadow:none!important}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  try{
    if(!('Notification' in window))return;

  }catch(e){}
}
function notify(title,body){
  try{
    if('Notification' in window){

/* Küp doluluk göstergesi (izometrik küp, alttan dolar) */
function cubeFill(pct,size=96){
  const id='cf'+Math.random().toString(36).slice(2,7);
  const p=Math.max(0,Math.min(1,pct)), y=6+ (1-p)*(54);
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" role="img" aria-label="Doluluk yüzde ${Math.round(p*100)}">
  <defs><clipPath id="${id}"><polygon points="32,5 57,19 57,46 32,60 7,46 7,19"/></clipPath></defs>
  <polygon points="32,5 57,19 57,46 32,60 7,46 7,19" fill="#E3EBE7"/>
  <g clip-path="url(#${id})"><rect x="0" y="${y}" width="64" height="64" fill="#17C27B"/><rect x="0" y="${y}" width="64" height="2.4" fill="#D6F26A"/></g>
  <polyline points="7,19 32,33 57,19" fill="none" stroke="#10223A" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="32" y1="33" x2="32" y2="60" stroke="#10223A" stroke-width="1.6"/>
  <polygon points="32,5 57,19 57,46 32,60 7,46 7,19" fill="none" stroke="#10223A" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

const tl=s=>String(s||'').toLocaleLowerCase('tr');
const findD=t=>{t=tl(t);for(const k in DIST){if(t.includes(tl(k)))return k}return null};
function dist(a,b){
  const A=findD(a),B=findD(b);
  if(A&&B){
    if(A===B)return 4+hash(a+b)%5;
    const [la1,lo1]=DIST[A],[la2,lo2]=DIST[B],r=Math.PI/180;
    const d=2*6371*Math.asin(Math.sqrt(Math.sin((la2-la1)*r/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin((lo2-lo1)*r/2)**2));
    return Math.max(4,Math.round(d*1.35));
  }
  return 8+hash(a+'|'+b)%28;
}

function prep(im){
  const c=document.createElement('canvas'),k=300/Math.max(im.width,im.height);
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  const a=document.createElement('canvas');a.width=a.height=64;
  const x=a.getContext('2d');x.drawImage(im,0,0,64,64);
  const d=x.getImageData(0,0,64,64).data,g=[];
  for(let i=0;i<d.length;i+=4)g.push(.3*d[i]+.59*d[i+1]+.11*d[i+2]);
  let sum=0,minx=64,maxx=0,miny=64,maxy=0,cnt=0;
  for(let y=1;y<63;y++)for(let xx=1;xx<63;xx++){
    const gx=g[y*64+xx+1]-g[y*64+xx-1],gy=g[(y+1)*64+xx]-g[(y-1)*64+xx],m=Math.hypot(gx,gy);
    sum+=m;if(m>28){cnt++;minx=Math.min(minx,xx);maxx=Math.max(maxx,xx);miny=Math.min(miny,y);maxy=Math.max(maxy,y)}
  }
  const mean=sum/3844,area=cnt>20?Math.max(.06,((maxx-minx)*(maxy-miny))/3844):.08;
  return{thumb:c.toDataURL('image/jpeg',.72),mean,area,sum};
}
function estimate(s){
  const c=CAT[Math.min(CAT.length-1,Math.floor(s.area*CAT.length*1.1))];
  const j=.88+(Math.round(s.sum)%25)/100;
  const conf=Math.round(Math.max(40,Math.min(96,40+Math.min(35,s.mean*3)+Math.min(21,s.area*30))));
  return{name:c.n,d:c.d.map(v=>Math.round(v*(0.95+(j-.88)/2))),kg:Math.max(1,Math.round(c.w*j)),conf,status:conf<66?'ask':'auto'};
}

}

/* ============ KURUMSAL ============ */
function tripCalc(t){
  const km=dist(t.from,t.to)+(t.extraKm||0);
  const v=pick({kg:t.kg,m3:t.m3*1.1,len:0})||VEH[5],xl=VEH[5];
  const e=emis(v,km);
  return{...t,km,v,price:price(v,km,t.urgent),kwh:e.kwh,co2:e.ev,ice:e.ice,oldCo2:km*xl.ice,oldPrice:Math.round(price(xl,km,false)*1.1),
    fill:Math.min(1,Math.max(t.kg/v.kg,t.m3*1.1/v.m3)),oldFill:Math.min(1,Math.max(t.kg/xl.kg,t.m3*1.1/xl.m3))};
}
const allTrips=()=>[...S.corp.sched,...S.corp.extra].map(tripCalc);
const sum=(a,k)=>a.reduce((x,y)=>x+y[k],0);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function stats(){
  const a=allTrips();
  return{n:a.length,cost:sum(a,'price'),oldCost:sum(a,'oldPrice'),co2:sum(a,'co2'),ice:sum(a,'ice'),oldCo2:sum(a,'oldCo2'),km:sum(a,'km'),kwh:sum(a,'kwh'),fill:avg(a.map(t=>t.fill)),oldFill:avg(a.map(t=>t.oldFill)),a};
}
const pct=(a,b)=>b?Math.round((1-a/b)*100):0;
function tstat(t){
  if(t.completed)return'Tamamlandı';
  if(t.status)return t.status;
  const ti=todayIdx();if(t.day<ti)return'Tamamlandı';if(t.day>ti)return'Planlı';
  const [h,m]=t.time.split(':').map(Number),n=new Date(),mins=n.getHours()*60+n.getMinutes(),s=h*60+m;
  return mins>=s?'Yolda':'Planlı';
}
function findTrip(id){return S.corp.sched.find(t=>t.id===id)||S.corp.extra.find(t=>t.id===id)}
function uploadDelivery(id){DELIVER_ID=id;$('#deliveryPhoto').click();}
function completeCorpTrip(id,photo){
  const t=findTrip(id);if(!t)return;
  t.completed=true;t.photo=photo;t.completedAt=iso(new Date());
  render(true);
  toast('Teslimat tamamlandı, fatura ve emisyon raporu oluşturuldu');
  notify("Han's Cube",S.corpName+' için sevkiyat tamamlandı, fatura hazır.');
  openTripDocs(id);
}
function tripDate(t){const d=new Date();d.setDate(d.getDate()-todayIdx()+t.day);return iso(d)}
function consolidation(){
  const s=S.corp.sched;let best=null;
  for(let i=0;i<s.length;i++)for(let j=i+1;j<s.length;j++){
    const a=s[i],b=s[j];if(a.from!==b.from||Math.abs(a.day-b.day)>1)continue;
    const kg=a.kg+b.kg,m3=a.m3+b.m3,v=pick({kg,m3:m3*1.1,len:0});if(!v)continue;
    const ka=dist(a.from,a.to)+(a.extraKm||0),kb=dist(b.from,b.to)+(b.extraKm||0),km=Math.max(ka,kb)+Math.min(ka,kb)*.35;
    const save=tripCalc(a).price+tripCalc(b).price-price(v,km,false);
    if(save>0&&(!best||save>best.save))best={a,b,v,save,kg,m3,extra:Math.round(Math.min(ka,kb)*.35)};
  }
  return best;
}
function applyMerge(){
  const c=consolidation();if(!c)return;
  c.a.kg=c.kg;c.a.m3=c.m3;c.a.extraKm=(c.a.extraKm||0)+c.extra;c.a.note='Birleşik: '+c.b.to;
  S.corp.sched=S.corp.sched.filter(x=>x.id!==c.b.id);render();toast('Seferler birleştirildi');
}
function bars(){
  const a=allTrips(),W=340,H=140,bw=15;let out='';
  for(let d=0;d<7;d++){
    const t=a.filter(x=>x.day===d),nf=avg(t.map(x=>x.fill)),of=avg(t.map(x=>x.oldFill)),x0=14+d*47;
    out+=`<rect x="${x0}" y="${H-of*100}" width="${bw}" height="${of*100}" rx="4" fill="#9AA8B6"/><rect x="${x0+bw+3}" y="${H-nf*100}" width="${bw}" height="${nf*100}" rx="4" fill="#17C27B"/><text x="${x0+bw+1}" y="${H+16}" text-anchor="middle" font-size="11" font-weight="700" fill="#5F6E80">${DAYS[d]}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H+22}" width="100%" role="img" aria-label="Günlük doluluk karşılaştırması"><line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="#D8E0DC"/><line x1="0" y1="${H-100}" x2="${W}" y2="${H-100}" stroke="#D8E0DC" stroke-dasharray="3 4"/>${out}</svg>`;
}

function qr(seed){
  const n=21,h=hash(seed);let s='',r=h;
  const fin=(x,y)=>{const f=(a,b)=>a<7&&b<7||a>=n-7&&b<7||a<7&&b>=n-7;return f(x,y)};
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    let on;
    const inF=(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
    if(inF){const ax=x%14>6?x-14:x,lx=(x<7?x:x-(n-7)),ly=(y<7?y:y-(n-7));on=lx===0||lx===6||ly===0||ly===6||(lx>=2&&lx<=4&&ly>=2&&ly<=4)}
    else{r=(r*1103515245+12345)>>>0;on=(r>>16)&1}
    if(on)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="-1 -1 ${n+2} ${n+2}" width="72" height="72" fill="#10223A" shape-rendering="crispEdges" aria-hidden="true">${s}</svg>`;
}
function docGreen(b){
  const e=emissionData(b),perc=Math.round(e.saved/e.ice*100),trees=e.saved/TREE_DAY,carkm=e.saved/0.17,by=buyer(b);
  return `<div class="paper doc-print">${docHead('Yeşil emisyon raporu',b.no.replace('HC-','YR-'),b)}
  <div class="small muted">${esc(by.n)} için ${b.no} numaralı taşıma</div>
  <div class="gbig"><div class="n">${fmt(e.saved,1)} kg</div><div class="muted" style="font-weight:700">CO₂e önlendi, %${perc} daha az emisyon</div></div>
  <div class="cmp"><div class="l"><span>Aynı sınıf dizel araç</span><span>${fmt(e.ice,1)} kg</span></div><div class="bar"><i class="ice" style="width:100%"></i></div>
  <div class="l"><span>${e.v.name} (elektrikli)</span><span>${fmt(e.ev,1)} kg</span></div><div class="bar"><i style="width:${Math.max(3,e.ev/e.ice*100)}%"></i></div></div>
  <table><tr><td>Egzoz emisyonu</td><td class="r">0 kg</td></tr><tr><td>Şarj elektriği emisyonu</td><td class="r">${fmt(e.ev,1)} kg</td></tr><tr><td>Enerji tüketimi</td><td class="r">${fmt(e.kwh,1)} kWh</td></tr><tr><td>Yük doluluğu</td><td class="r">%${fillOf(b)}</td></tr>
  <tr><td>Önlenen emisyon, ağaç eşdeğeri</td><td class="r">${fmt(trees)} ağacın 1 günlük tutumu</td></tr><tr><td>Önlenen emisyon, dizel otomobil eşdeğeri</td><td class="r">${fmt(carkm)} km yol</td></tr></table>
  <div class="cert">${qr(b.no)}<div class="small"><b>Doğrulama kodu</b><br>${b.no.replace(/-/g,'').slice(-10)}<br><span class="muted">Bu rapor Han's Cube sisteminde kayıtlıdır.</span></div></div>
  <div class="note">Değerler örnek katsayılarla hesaplanmıştır (şebeke ${fmt(EF,2)} kg CO₂e/kWh). Prototip amaçlıdır.</div></div>`;
}
function fillOf(b){const v=V(b.veh),kg=b.items.reduce((a,i)=>a+i.kg*i.qty,0),m3=b.items.reduce((a,i)=>a+i.d[0]*i.d[1]*i.d[2]/1e6*i.qty,0)*1.2;return Math.round(Math.min(1,Math.max(kg/v.kg,m3/(v.m3*.92)))*100)}
function docMonthly(){
  const s=stats(),m=4.3,by=S.corpName;
  return `<div class="paper doc-print">${docHead('Aylık yeşil rapor','YR-2026-09-K01',{date:iso(new Date())})}
  <div class="small muted">${esc(by)}, Eylül 2026 (haftalık program × 4,3)</div>
  <div class="gbig"><div class="n">${fmt((s.ice-s.co2)*m)} kg</div><div class="muted" style="font-weight:700">CO₂e önlendi (aynı sınıf dizel araçlara göre)</div></div>
  <table><tr><th>Güzergâh</th><th>Araç</th><th class="r">kg CO₂e/ay</th></tr>
  ${s.a.map(t=>`<tr><td>${DAYS[t.day]} ${esc(t.from)} → ${esc(t.to)}</td><td>${t.v.name}</td><td class="r">${fmt(t.co2*m,1)}</td></tr>`).join('')}
  <tr class="tt"><td colspan="2" class="r">Toplam emisyon</td><td class="r">${fmt(s.co2*m,1)}</td></tr>
  <tr><td colspan="2" class="r">Dizel eşdeğeri</td><td class="r">${fmt(s.ice*m,1)}</td></tr>
  <tr><td colspan="2" class="r">Ortalama araç doluluğu</td><td class="r">%${Math.round(s.fill*100)}</td></tr></table>
  <div class="cert">${qr('aylik'+s.n)}<div class="small"><b>Doğrulama kodu</b><br>YR2026090K01<br><span class="muted">Kurumsal karbon envanteri için kayıt.</span></div></div>
  <div class="note">Prototip raporudur. Katsayılar örnektir.</div></div>`;
}

/* ============ YÖNETİCİ PANELİ (Han's Cube ekibi) ============ */
function adminHeader(sub){
  return `<div class="top">${logo(38)}<div class="grow"><div class="name">Han's Cube <span class="chip dark" style="margin-left:6px;vertical-align:middle;font-size:11px">Ekip</span></div><div class="small muted">${sub}</div></div><button class="iconbtn" onclick="adminLogout()" aria-label="Çıkış yap">${ic('back')}</button></div>`;
}
function adminLogin(){return `<div class="welcome" style="justify-content:center">
  <div style="text-align:center">${logo(56)}<h1 style="font-size:28px;margin-top:10px">Ekip girişi</h1><p class="lead" style="margin:0 auto">Bu bölüm yalnızca Han's Cube yöneticileri içindir.</p></div>
  <div class="card">
   <label class="lbl">E-posta</label><div class="inp">${ic('user')}<input id="adE" type="email" placeholder="ad.soyad@hanscube.com" value="${esc(S.admin.email)}"></div>
   <label class="lbl">Şifre</label><div class="inp">${ic('lock')}<input id="adP" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')adminDoLogin()"></div>
   <div class="btns"><button class="btn dark" onclick="adminDoLogin()">${ic('lock')}Giriş yap</button></div>
   <p class="small muted" style="text-align:center;margin-top:10px">Prototip demo girişi:<br><b>admin@hanscube.com</b> / <b>HansCube2026</b></p>
  </div>
  <button class="linkbtn" onclick="switchRole()">Uygulamaya dön</button>
 </div>`}
function adminDoLogin(){
  const e=$('#adE').value.trim(),p=$('#adP').value;
  S.admin.email=e;
  if(e.toLowerCase()===ADMIN_CREDS.email&&p===ADMIN_CREDS.pass){S.admin.authed=true;S.admin.tab='dash';render(true);toast('Hoş geldin, Han\'s Cube ekibi paneline giriş yaptın')}
  else toast('E-posta veya şifre hatalı');
}
function adminLogout(){S.admin.authed=false;S.admin.chatWith=null;S.mode=null;render(true)}
function adminGoto(tab){S.admin.tab=tab;S.admin.chatWith=null;render(true)}
const ADMIN_TABS=[['dash','Panel','bell'],['apps','Başvurular','shield'],['reqs','Talepler','list'],['chat','Mesajlar','msg']];
function renderAdmin(top){
  const v=$('#view'),t=$('#tabs');
  if(!S.admin.authed){v.innerHTML=adminLogin();t.style.display='none';t.innerHTML='';return}
  t.style.display='flex';
  t.innerHTML=ADMIN_TABS.map(([k,l,i])=>`<button class="${S.admin.tab===k?'on':''}" onclick="adminGoto('${k}')" aria-label="${l}"><span class="ic">${ic(i)}</span>${l}</button>`).join('');
  const fn=ADMIN_VIEW[S.admin.tab];
  const y=v.scrollTop;
  v.innerHTML=fn();
  v.style.scrollBehavior='auto';v.scrollTop=top?0:y;v.style.scrollBehavior='';
}
const pendingApps=()=>S.carrierApps.filter(a=>a.status==='pending');
const approvedDrivers=()=>S.carrierApps.filter(a=>a.status==='approved');
function buildNotifs(){
  const out=[];
  pendingApps().forEach(a=>out.push({icon:'shield',title:'Yeni sürücü başvurusu: '+a.name,desc:V(a.vehicle).name+' · '+a.doc,onclick:"adminGoto('apps')"}));
  S.bookings.filter(b=>b.status==='Tamamlandı'&&!b.paid).forEach(b=>out.push({icon:'doc',title:'Ödeme bekliyor: '+b.no,desc:TL(b.price*1.2),onclick:"adminGoto('reqs')"}));
  S.bookings.filter(b=>b.status==='Onaylandı'&&!b.driver).forEach(b=>out.push({icon:'truck',title:'Sürücü ataması bekliyor: '+b.no,desc:esc(b.from)+' → '+esc(b.to),onclick:"adminGoto('reqs')"}));
  S.corp.extra.filter(t=>t.urgent&&t.day===todayIdx()).forEach(t=>out.push({icon:'bolt',title:'Acil sevkiyat: '+t.from+' → '+t.to,desc:'Kurumsal, '+t.time,onclick:"adminGoto('reqs')"}));
  return out;
}
function notifCard(n){return `<button class="notif" style="width:100%" onclick="${n.onclick}"><span class="dot"></span><span class="iconbtn" style="background:var(--soft)">${ic(n.icon)}</span><span class="grow"><b style="display:block;font-size:14px">${esc(n.title)}</b><span class="small muted">${esc(n.desc||'')}</span></span></button>`}
const ADMIN_VIEW={};
ADMIN_VIEW.dash=()=>{
  const pend=pendingApps(),drv=approvedDrivers();
  const todayInd=S.bookings.filter(b=>b.date===iso(new Date())).length;
  const todayCorp=allTrips().filter(t=>t.day===todayIdx()).length;
  const unpaid=S.bookings.filter(b=>b.status==='Tamamlandı'&&!b.paid);
  const notifs=buildNotifs();
  return adminHeader('Yönetim paneli')+`
  <div class="kpis">
   <div class="kpi"><span class="small muted">Bekleyen başvuru</span><div class="v">${pend.length}</div></div>
   <div class="kpi"><span class="small muted">Onaylı sürücü</span><div class="v">${drv.length}</div></div>
   <div class="kpi"><span class="small muted">Bugünkü talep</span><div class="v">${todayInd+todayCorp}</div></div>
   <div class="kpi"><span class="small muted">Bekleyen ödeme</span><div class="v">${unpaid.length}</div><div class="d ${unpaid.length?'bad':''}">${TL(unpaid.reduce((a,b)=>a+b.price*1.2,0))}</div></div>
  </div>
  <h3 class="head" style="font-size:17px;margin:16px 2px 8px">Bildirimler</h3>
  ${notifs.length?notifs.map(notifCard).join(''):'<div class="card muted">Yeni bildirim yok.</div>'}`;
};
ADMIN_VIEW.apps=()=>{
  const list=S.carrierApps.slice().sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||b.id-a.id);
  return adminHeader('Sürücü başvuruları')+`<h2 class="h2">Başvurular</h2>`+(list.length?list.map(appCard).join(''):'<div class="card muted">Başvuru yok.</div>');
};
function appCard(a){
  const v=V(a.vehicle);
  const chip=a.status==='pending'?'<span class="chip amber">Bekliyor</span>':a.status==='approved'?'<span class="chip">Onaylı</span>':'<span class="chip red">Reddedildi</span>';
  return `<div class="card"><div class="row sp">${chip}<span class="small muted">${trDate(a.date)}</span></div>
  <div class="row" style="margin-top:8px">${vsvg(a.vehicle)}<div class="grow"><b style="font-family:var(--head);font-size:17px">${esc(a.name)}</b><div class="small muted">${v.name}${a.electric?' · Elektrikli':''} · ${esc(a.plate)}</div></div></div>
  <div class="kv"><span class="muted">Telefon</span><b>${esc(a.phone)}</b></div>
  <div class="kv"><span class="muted">Belge no</span><b>${esc(a.doc)}</b></div>
  ${a.status==='red'&&a.reason?`<div class="kv"><span class="muted">Red nedeni</span><b>${esc(a.reason)}</b></div>`:''}
  ${a.status==='pending'?`<div class="btns"><button class="btn sm" onclick="approveApp(${a.id})">${ic('check')}Onayla</button><button class="btn sm ghost" onclick="rejectAppUI(${a.id})">${ic('x')}Reddet</button></div>`:''}
  ${a.status==='approved'?`<button class="btn sm dark" style="margin-top:10px" onclick="openChat(${a.id})">${ic('msg')}Sürücüyle iletişime geç</button>`:''}
  </div>`;
}
function approveApp(id){const a=S.carrierApps.find(x=>x.id===id);a.status='approved';a.decidedAt=iso(new Date());render();toast(a.name+' onaylandı, sürücüye bildirim gönderildi')}
let RJREASON='';
function rejectAppUI(id){
  RJREASON='';
  sheet(`<h2 class="h2">Başvuruyu reddet</h2><p class="sub">Sürücüye iletilecek kısa bir neden seç.</p>
  <div class="chips" id="rjChips">${['Belge geçersiz','Bölge dışı','Araç uygun değil','Kapasite dolu'].map(r=>`<button class="pick" onclick="pickReason(this)">${r}</button>`).join('')}</div>
  <label class="lbl">Ek not (opsiyonel)</label><div class="inp"><input id="rjNote" placeholder="Not ekle"></div>
  <div class="btns"><button class="btn red" onclick="rejectApp(${id})">Reddi onayla</button></div>`);
}
function pickReason(btn){document.querySelectorAll('#rjChips .pick').forEach(b=>b.classList.remove('on'));btn.classList.add('on');RJREASON=btn.textContent}
function rejectApp(id){
  const a=S.carrierApps.find(x=>x.id===id);
  a.status='red';a.reason=((RJREASON?RJREASON+'. ':'')+($('#rjNote')?.value||'').trim()).trim()||'Belirtilmedi';RJREASON='';
  closeSheet();render();toast('Başvuru reddedildi');
}
ADMIN_VIEW.reqs=()=>{
  const ind=S.bookings.map(b=>({...b,kind:'ind'}));
  const corp=allTrips().map(t=>({kind:'corp',id:t.id,from:t.from,to:t.to,date:tripDate(t),time:t.time,km:t.km,v:t.v,price:t.price,status:tstat(t),completed:!!t.completed||tstat(t)==='Tamamlandı'}));
  const all=[...ind,...corp].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.time||'').localeCompare(a.time||''));
  return adminHeader('Tüm talepler')+`<h2 class="h2">Talepler</h2><p class="sub">Bireysel ve kurumsal sevkiyatların tamamı.</p>`+(all.length?all.map(reqCard).join(''):'<div class="card muted">Kayıt yok.</div>');
};
function reqCard(r){
  const vehId=r.kind==='ind'?r.veh:r.v.id,vv=V(vehId),pr=r.kind==='ind'?r.price*1.2:r.price;
  const payChip=r.kind==='ind'?(r.payMethod==='cash'?'<span class="chip amber">Kapıda nakit</span>':'<span class="chip">Online ödendi</span>'):'';
  return `<div class="card"><div class="row sp"><span class="chip ${r.kind==='ind'?'blue':'dark'}">${r.kind==='ind'?'Bireysel':'Kurumsal'}</span><span class="chip ${statusChip(r.status)}">${r.status}</span></div>
  <div class="route" style="margin-top:6px">${esc(r.from)} <span class="muted">→</span> ${esc(r.to)}</div>
  <div class="small muted">${trDate(r.date)}, ${r.time}${r.km?', '+r.km+' km':''}</div>
  <div class="vline">${vsvg(vehId)}<div class="grow"><b>${vv.name}</b>${r.driver?`<div class="small muted">Sürücü: ${esc(r.driver)}</div>`:''}</div><b class="head" style="font-size:17px">${TL(pr)}</b></div>
  <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:6px">${payChip}${r.kind==='ind'&&r.rating?`<span class="chip amber">★${r.rating.stars}</span>`:''}</div>
  <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px">
  ${r.kind==='ind'&&r.status==='Onaylandı'&&!r.driver?`<button class="btn sm" onclick="assignDriverUI(${r.id})">${ic('truck')}Sürücüye ilet</button>`:''}
  ${r.kind==='ind'&&r.status==='Yolda'&&r.payMethod==='cash'?`<button class="btn sm ghost" onclick="resendCode(${r.id})">${ic('send')}Kodu tekrar gönder</button><button class="btn sm dark" onclick="completeCashUI(${r.id})">${ic('check')}Teslimatı tamamla</button>`:''}
  ${r.kind==='ind'&&r.status==='Yolda'&&r.payMethod==='online'?`<button class="btn sm dark" onclick="completeOnline(${r.id})">${ic('check')}Teslimatı tamamla</button>`:''}
  ${r.kind==='ind'&&r.status==='Tamamlandı'?(r.paid?`<span class="chip">Ödeme yapıldı</span>`:`<button class="btn sm dark" onclick="markPaid(${r.id})">${ic('check')}Ödemeyi aktar</button>`):''}
  ${r.kind==='corp'?(r.completed?`<button class="btn sm dark" onclick="openTripDocs(${r.id})">${ic('doc')}Belgeler</button><span class="small muted">Kurumsal fatura döneminde tahsil edilir</span>`:`<button class="btn sm" onclick="uploadDelivery(${r.id})">${ic('cam')}Teslimatı tamamla (görsel yükle)</button>`):''}
  </div></div>`;
}
function resendCode(id){
  const b=S.bookings.find(x=>x.id===id);
  notify("Han's Cube",'Teslimat doğrulama kodun: '+b.verifyCode+' — '+b.from+' → '+b.to);
  toast('Kod müşteriye tekrar gönderildi');
}
function completeCashUI(id){
  sheet(`<h2 class="h2">Teslimatı tamamla</h2><p class="sub">Müşterinin sana söylediği doğrulama kodunu gir.</p>
  <div class="inp"><input id="ccCode" inputmode="numeric" maxlength="4" placeholder="4 haneli kod" style="text-align:center;letter-spacing:6px;font-size:20px;font-weight:800"></div>
  <div class="btns"><button class="btn" onclick="completeCash(${id})">${ic('check')}Doğrula ve tamamla</button></div>`);
}
function completeCash(id){
  const b=S.bookings.find(x=>x.id===id),code=($('#ccCode').value||'').trim();
  if(code!==b.verifyCode){toast('Kod hatalı, tekrar dene');return}
  b.status='Tamamlandı';b.completedAt=iso(new Date());
  closeSheet();render();toast('Teslimat doğrulandı ve tamamlandı');
  notify("Han's Cube",b.no+' teslim edildi.');
}
function completeOnline(id){
  const b=S.bookings.find(x=>x.id===id);
  b.status='Tamamlandı';b.completedAt=iso(new Date());
  render();toast('Teslimat tamamlandı');
  notify("Han's Cube",b.no+' teslim edildi.');
}
function assignDriverUI(id){
  const drv=approvedDrivers();
  if(!drv.length){toast('Onaylı sürücü yok');return}
  sheet(`<h2 class="h2">Sürücüye ilet</h2><p class="sub">Bu talebi hangi sürücüye iletmek istersin?</p>
  ${drv.map(d=>`<button class="trip" style="width:100%" onclick="assignDriver(${id},'${esc(d.name).replace(/'/g,"\\'")}')">${vsvg(d.vehicle)}<div class="grow"><b>${esc(d.name)}</b><div class="small muted">${V(d.vehicle).name} · ${esc(d.plate)}</div></div></button>`).join('')}
  <button class="linkbtn" onclick="closeSheet()">Vazgeç</button>`);
}
function assignDriver(id,name){
  const b=S.bookings.find(x=>x.id===id);if(b){b.driver=name;b.status='Yolda'}
  closeSheet();render();toast(name+' bilgilendirildi, talebi kabul etmesi bekleniyor');
}
function markPaid(id){const b=S.bookings.find(x=>x.id===id);b.paid=true;b.paidAt=iso(new Date());render();toast('Ödeme sürücüye aktarıldı')}
ADMIN_VIEW.chat=()=>{
  if(S.admin.chatWith)return chatThread(S.admin.chatWith);
  const drv=approvedDrivers();
  return adminHeader('Sürücü iletişimi')+`<h2 class="h2">Mesajlar</h2>`+(drv.length?drv.map(d=>`<button class="trip" style="width:100%" onclick="openChat(${d.id})">${vsvg(d.vehicle)}<div class="grow"><b>${esc(d.name)}</b><div class="small muted">${V(d.vehicle).name} · ${esc(d.plate)}</div></div><span class="iconbtn" style="background:var(--soft)">${ic('msg')}</span></button>`).join(''):'<div class="card muted">Onaylı sürücü yok.</div>');
};
function openChat(id){
  S.admin.chatWith=id;
  if(!S.chats[id])S.chats[id]=[{from:'driver',text:'Merhaba, bugünkü sefer için bilgi bekliyorum.',time:pad(new Date().getHours())+':'+pad(new Date().getMinutes())}];
  S.admin.tab='chat';render(true);
}
function chatThread(id){
  const d=S.carrierApps.find(x=>x.id===id),msgs=S.chats[id]||[];
  return `<div class="top"><button class="iconbtn" onclick="S.admin.chatWith=null;render(true)" aria-label="Geri">${ic('back')}</button><div class="grow"><div class="name" style="font-size:17px">${esc(d.name)}</div><div class="small muted">${V(d.vehicle).name} · ${esc(d.plate)}</div></div></div>
  <div style="margin-top:10px">${msgs.map(m=>`<div class="bubble ${m.from==='admin'?'me':'them'}">${esc(m.text)}<span class="t">${m.time}</span></div>`).join('')}</div>
  <div class="row" style="margin-top:12px;gap:8px"><div class="inp grow" style="flex:1"><input id="chatIn" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter')sendChat(${id})"></div><button class="btn sm dark" onclick="sendChat(${id})" aria-label="Gönder">${ic('send')}</button></div>`;
}
function sendChat(id){
  const inp=$('#chatIn');if(!inp)return;const t=inp.value.trim();if(!t)return;
  S.chats[id].push({from:'admin',text:t,time:pad(new Date().getHours())+':'+pad(new Date().getMinutes())});
  render(true);
  setTimeout(()=>{S.chats[id].push({from:'driver',text:'Anlaşıldı, hemen yola çıkıyorum.',time:pad(new Date().getHours())+':'+pad(new Date().getMinutes())});if(S.admin.chatWith===id)render(true)},1200);
}

/* Başlat */
render();
</script>
